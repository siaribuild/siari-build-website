<!-- ============================================================================
     Paste these into the <head> of your index.html (Vite's root HTML).
     They can't live in React components because the browser must see them in
     the initial HTML, before any JS runs. Ordered by impact.
     ============================================================================ -->

<!-- 1. Language (Accessibility + SEO). Set on the <html> tag itself: -->
<!--    <html lang="en">                                                       -->

<!-- 2. Preconnect to the image + data origins so the TLS handshake to the CDN
        happens in parallel with HTML parsing (saves ~100-300ms on the hero LCP). -->
<link rel="preconnect" href="https://cdn.sanity.io" crossorigin>
<link rel="preconnect" href="https://<PROJECT_ID>.api.sanity.io" crossorigin>
<link rel="dns-prefetch" href="https://cdn.sanity.io">

<!-- 3. Preload the fonts actually used above the fold. Space Grotesk 700 renders
        the hero <h1> (LCP text); Inter 400 is the body. Preloading removes the
        FOIT/late-swap. Point href at the real hashed woff2 emitted by Fontsource
        in your build (check dist/assets), or self-host a subset. -->
<link rel="preload" as="font" type="font/woff2" crossorigin
      href="/assets/space-grotesk-latin-700-normal-<hash>.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin
      href="/assets/inter-latin-400-normal-<hash>.woff2">

<!-- 4. (Optional but powerful) Preload the LCP hero image. Because heroes now use
        a real <img fetchpriority="high">, the browser prioritizes it — but if the
        home hero image URL is known at build time you can preload its responsive
        source for an extra LCP win:
     <link rel="preload" as="image"
           imagesrcset="https://cdn.sanity.io/.../hero?w=1024&auto=format 1024w,
                        https://cdn.sanity.io/.../hero?w=1600&auto=format 1600w,
                        https://cdn.sanity.io/.../hero?w=1920&auto=format 1920w"
           imagesizes="100vw" fetchpriority="high">
     Skip if the hero image is CMS-driven and not known at build time. -->

<!-- 5. Theme colour for mobile browser chrome (Best Practices / polish). -->
<meta name="theme-color" content="#111111">
