<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Baseline/fallback metadata. Per-page title, description, Open Graph,
         and Twitter tags are injected at runtime by the Seo component
         (react-helmet-async), so they are intentionally NOT duplicated here. -->
    <title>SiaRi Build | Custom Homes, Renovations &amp; Extensions Melbourne</title>
    <meta
      name="description"
      content="SiaRi Build delivers custom homes, renovations, extensions and quality construction across Melbourne."
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="SiaRi Build" />
    <meta
      property="og:description"
      content="Custom homes, renovations and extensions across Melbourne."
    />
    <meta property="og:url" content="https://siaribuild.com.au" />

    <!-- Fonts are now self-hosted via Fontsource (imported in src/styles/fonts.css),
         so there is no Google Fonts <link> here. This removes the third-party
         request and the font-swap flash on load. -->

    <style>
      html, body { height: 100%; margin: 0; }
      #root { height: 100%; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
